name: Build SFO Editor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu
            arch: x64
            name-build: SFOEditor-Ubuntu
            exe: SFOEditor-Ubuntu
            sep: ":"
          - os: windows-latest
            platform: windows
            arch: x64
            name-build: SFOEditor-Windows
            exe: SFOEditor-Windows.exe
            sep: ";"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "${{ matrix.name-build }}" \
            --icon "source/icon_sfoeditor.ico" \
            --add-data "source/icon_sfoeditor.ico${{ matrix.sep }}." \
            --paths source \
            --add-data "source/locales${{ matrix.sep }}locales" \
            --add-data "source/help${{ matrix.sep }}help" \
            --add-binary "source/sfo_app${{ matrix.sep }}sfo_app" \
            source/main.py

      - name: Make 7z
        shell: bash
        run: |
          mkdir package
          cp "dist/${{ matrix.exe }}" package/
          7z a "SFOEditor-${{ matrix.platform }}-${{ matrix.arch }}.7z" ./package/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFOEditor-${{ matrix.platform }}-${{ matrix.arch }}
          path: SFOEditor-${{ matrix.platform }}-${{ matrix.arch }}.7z

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "2.0${{ github.run_number }}" ./artifacts/**/*.7z \
            --target "${{ github.sha }}" \
            --title "SFO Editor 2.0.${{ github.run_number }}" \
            --notes "Build SFO Editor (${{ github.run_number }}) from GitHub Actions"
